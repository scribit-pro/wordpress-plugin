name: Publishing plugin
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Create archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/workflows/setup
        with:
          php-version: '8.0'

      - name: Create archive
        shell: bash
        run: composer run build

      - name: Upload release asset
        run: gh release upload "${{ github.event.release.tag_name }}" scribit-pro.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
